            - separator [ref=e4215]
            - generic [ref=e4216]:
              - generic [ref=e4217]:
                - generic [ref=e4218]: 
                - heading "Decaying Touch." [level=3] [ref=e4219]
                - text: "Costs 1 Investiture. Attack +9 vs. Spiritual, reach 20 ft., one target. Graze: 16 (3d10) spirit damage. Hit: 25 (3d10 + 9) spirit damage, and the target must succeed on a DC 16 Agility test or their armor rusts and decays, permanently decreasing its deflect value by 1. Armor damaged in this way can be repaired with proper materials as a downtime activity."
              - generic [ref=e4220]:
                - generic [ref=e4221]: 
                - heading "Burst of Flame." [level=3] [ref=e4222]
                - text: Costs 2 Investiture. The Dustbringer emits a burst of fire that deals 6 (1d12) energy damage to each character within 20 feet of them and sets unattended objects in that area ablaze. Additionally, the Dustbringer can spend 1 focus or more to shower sparks onto that number of enemies within 30 feet of them; each target must succeed on a DC 16 Agility test or lose one focus on their next turn.
              - generic [ref=e4223]:
                - generic [ref=e4224]: 
                - heading "Eroding Escape." [level=3] [ref=e4225]
                - text: Costs 1 Investiture. The Dustbringer targets themself or an ally in reach, ending one condition on them that is either applying the Immobilized condition, the Restrained condition, or a disadvantage on any physical test.
              - generic [ref=e4226]:
                - generic [ref=e4227]: 
                - heading "Regenerate." [level=3] [ref=e4228]
                - text: Costs 1 Investiture. The Dustbringer recovers 7 (1d6 + 4) health. They can use this free action even while Unconscious or otherwise prevented from using actions.
              - generic [ref=e4229]:
                - generic [ref=e4230]: 
                - heading "Skate." [level=3] [ref=e4231]
                - text: Costs 1 Focus. The Dustbringer moves up to their movement rate.
