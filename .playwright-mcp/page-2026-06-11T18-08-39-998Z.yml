                - heading "Adhesion." [level=3] [ref=e199]
                - text: Costs 1 Investiture or More. The squire uses Adhesion to infuse two Small objects, sticking them together for a number of rounds equal to the Investiture spent. The squire can infuse a surface of any size in place of one of the objects. If this action is used during combat, the squire must make a DC 15 Adhesion test. On a failure, the objects aren't infused and the Investiture isn't spent.
              - generic [ref=e200]:
                - generic [ref=e201]: 
                - heading "Gravitation." [level=3] [ref=e202]
                - text: Costs 1 Investiture. The squire gives themselves a flying rate of 25 feet until the start of their next turn. At the start of each of their turns, they can spend 1 Investiture to maintain this effect for an additional round.
              - generic [ref=e203]:
                - generic [ref=e204]: 
                - heading "Parry." [level=3] [ref=e205]
                - text: Costs 1 Focus. Before the squire is hit by a melee attack, they increase their Physical defense by 3 against that attack, potentially causing it to miss. To do so, the squire must sense the attacker and be wielding a melee weapon.
