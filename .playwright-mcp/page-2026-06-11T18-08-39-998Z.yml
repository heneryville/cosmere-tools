              - generic [ref=e4208]:
                - heading "Radiant Shardplate (4 Charges)." [level=3] [ref=e4209]
                - text: The Dustbringer is equipped with Shardplate. Before they take damage, they can expend a charge (no action required) to increase their deflect value against that damage by 10. While the armor has charges, all Invested tests against the Dustbringer gain a disadvantage, and the armor's deflect value applies to all damage types. After the armor runs out of charges, some of the Dustbringer's attributes and skills are reduced by 2, along with their related modifiers; these statistics are marked with an asterisk (*).
              - generic [ref=e4210]:
                - heading "Breakable Armor." [level=3] [ref=e4211]
                - text: After the Dustbringer is hit by an attack, the attacker can spend an Opportunity to cause the Dustbringer's Shardplate to lose 1 charge.
              - generic [ref=e4212]:
                - heading "Slippery." [level=3] [ref=e4213]
                - text: While they have 1 Investiture or more, the Dustbringer can't be grazed and Reactive Strikes against them gain a disadvantage.
