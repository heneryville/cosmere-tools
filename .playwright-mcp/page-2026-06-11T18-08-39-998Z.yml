                - heading "Disorienting Distraction." [level=3] [ref=e474]
                - text: The thief throws sand, flour, or a similar substance to distract and confuse foes. Each enemy within 10 feet of them must succeed on a DC 13 Agility test or become Disoriented until the end of the thief's next turn.
              - generic [ref=e475]:
                - generic [ref=e476]: 
                - heading "Pickpocket." [level=3] [ref=e477]
                - text: The thief attempts to rifle through the belongings of a humanoid within 5 feet of them, making an opposed Thievery test against the target's Perception. If the target is Disoriented, the target gains a disadvantage on their test. If the thief succeeds, they can choose to steal up to 50 marks or one item the target isn't wielding or wearing.
              - generic [ref=e478]:
                - generic [ref=e479]: 
                - heading "Slippery." [level=3] [ref=e480]
                - text: After an enemy ends a Move action within 5 feet of the thief, the thief can use the Disengage action as a reaction. If the thief ends this movement in cover or in an area where an enemy's primary sense is obscured, enemies affected by that cover or obscured senses gain a disadvantage on attacks against the thief until the end of the thief's next turn.
