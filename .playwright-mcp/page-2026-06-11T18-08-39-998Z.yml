                - heading "Burst of Flame." [level=3] [ref=e4984]
                - text: Costs 2 Investiture. The Dustbringer emits a burst of fire that deals 4 (1d8) energy damage to each character within 10 feet of them and sets unattended objects in that area ablaze. Additionally, the Dustbringer can spend 1 focus or more to shower sparks onto that many enemies within 30 feet of them; each target must succeed on a DC 14 Agility test or lose one focus on their next turn.
