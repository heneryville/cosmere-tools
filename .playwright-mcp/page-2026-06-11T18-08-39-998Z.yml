                - text: When a character triggers a Reactive Strike reaction from the thief, the thief can instead use their Pickpocket as a reaction (without spending focus for a Reactive Strike).
              - generic [ref=e467]:
                - heading "Vanishing Act." [level=3] [ref=e468]
                - text: At the end of the thief's turn, if they're in cover or in an area where their enemy's primary sense is obscured, the thief can make a Stealth test (no action required) with advantage against the Spiritual defense of each enemy who can sense them. Each enemy they succeed against loses track of them and can no longer sense them until the thief attacks or takes another action that would expose them.
