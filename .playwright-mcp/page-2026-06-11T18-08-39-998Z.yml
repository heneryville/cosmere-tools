                - text: "Costs 1 Investiture. Attack +6 vs. Spiritual, reach 5 ft., one target. Graze: 13 (3d8) spirit damage. Hit: 19 (3d8 + 6) spirit damage, and the target must succeed on a DC 14 Agility test or their armor rusts and decays, permanently decreasing its deflect value by 1. Armor damaged in this way can be repaired with proper materials as a downtime activity."
