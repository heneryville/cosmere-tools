                - heading "Eroding Escape." [level=3] [ref=e4987]
                - text: Costs 1 Investiture. The Dustbringer targets themself or an ally in reach, ending one condition on them that is either applying the Immobilized condition, the Restrained condition, or a disadvantage on a physical test.
              - generic [ref=e4988]:
                - generic [ref=e4989]: 
                - heading "Regenerate." [level=3] [ref=e4990]
                - text: Costs 1 Investiture. The Dustbringer recovers 5 (1d6 + 2) health. They can use this free action even while Unconscious or otherwise prevented from using actions.
