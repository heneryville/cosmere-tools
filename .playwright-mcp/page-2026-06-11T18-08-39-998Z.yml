            - generic [ref=e2215]:
              - generic [ref=e2216]:
                - heading "Boss." [level=3] [ref=e2217]
                - text: The servant of Yelig-nar can take both a fast turn and a slow turn each round. After an enemy finishes a turn, the servant of Yelig-nar can spend 1 focus to immediately use an extra single or double action. Additionally, they can spend 1 focus on their turn to remove a condition from themself.
              - generic [ref=e2218]:
                - heading "Blightwind's Host." [level=3] [ref=e2219]
                - text: When the servant of Yelig-nar dies, their soul is consumed by the Unmade and unable to form in the Cognitive Realm, and Yelig-nar escapes from the corpse as black smoke.
              - generic [ref=e2220]:
                - heading "Crystal Carapace." [level=3] [ref=e2221]
                - text: Before the servant of Yelig-nar is hit by an attack, they can spend 1 focus to turn it into a graze (no action required). Additionally, they can use their carapace like a shield, allowing them to use the Brace action.
              - generic [ref=e2222]:
                - heading "Immunities." [level=3] [ref=e2223]
                - text: The servant of Yelig-nar is immune to the Exhausted, Stunned, and Surprised conditions.
              - generic [ref=e2224]:
                - heading "Mobile." [level=3] [ref=e2225]
                - text: When the servant of Yelig-nar willingly moves on their turn, they can choose to pause moving and use another action before finishing their available movement. They can resume that movement as a free action any time before the end of their turn.
            - heading "ACTIONS" [level=2] [ref=e2226]
            - separator [ref=e2227]
            - generic [ref=e2228]:
              - generic [ref=e2229]:
                - generic [ref=e2230]: 
                - heading "Unmade Cohesion." [level=3] [ref=e2231]
                - text: Costs 1 Investiture. The servant of Yelig-nar chooses a Huge (15-foot) space within 30 feet of them, turning all stone in it to liquid. Each enemy standing on stone within that area sinks into the ground and becomes Slowed for as long as they're in the liquid stone. At the start of each round, the servant of Yelig-nar can spend 1 Investiture to maintain this effect for another round. If they don't, the stone hardens and any characters in it are Immobilized. A trapped target or a character who can reach them can use a Skill to make a DC 20 Athletics test, freeing the trapped target on a success; otherwise, the target remains trapped until they're dug out of the stone.
              - generic [ref=e2232]:
                - generic [ref=e2233]: 
                - heading "Unmade Gravitation." [level=3] [ref=e2234]
                - text: "Costs 1 Investiture. The servant of Yelig-nar chooses one of the following effects: Deadly Leap — They leap up to 40 feet without triggering Reactive Strikes, then use their Shardblade as a single action against a character within reach. When they do so, they can't spend focus to knock the target Prone. Flight — The servant of Yelig-nar gains a flying rate of 40 feet until the start of their next turn. At the start of each of their turns, they can spend 1 Investiture to maintain this effect for an additional round."
              - generic [ref=e2235]:
                - generic [ref=e2236]: 
                - heading "Unmade Transformation." [level=3] [ref=e2237]
                - text: Costs 1 Investiture. The servant of Yelig-nar chooses a Huge (15-foot) space within 60 feet of them, transforming all air in it to fire. Each character in that area takes 11 (2d10) energy damage, and unaccompanied flammable objects in that area catch on fire.
              - generic [ref=e2238]:
                - generic [ref=e2239]: 
                - heading "Skate." [level=3] [ref=e2240]
                - text: Costs 1 Focus. The servant of Yelig-nar moves up to their movement rate in a straight line.
