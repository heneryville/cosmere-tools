                - heading "Invested Enhancement." [level=3] [ref=e5417]
                - text: Costs 1 Investiture. The larkin becomes Enhanced [Strength + 1] and Enhanced [Speed + 1] until the end of their next turn. This temporarily increases each of their Physical skills by 1, including their Bite action's attack and damage rolls. At the end of each of the larkin's turns, they can spend 1 Investiture to maintain this effect for an additional round.
              - generic [ref=e5418]:
                - generic [ref=e5419]: 
                - heading "Drain Light." [level=3] [ref=e5420]
                - text: "If the larkin isn't at full Investiture, they choose one of the following targets within 10 feet of them, draining the chosen target of power: Object with Charges — a fabrial or other object with charges loses 3 (1d6) charges; Group of Spheres — up to 3 (1d6) infused marks or broams within range lose the Stormlight or other Light infused in them; Infused Object or Character — the target (or effect infused in the target) loses 3 (1d6) Investiture. If the target is a character, or if it is an object worn or held by a character, the larkin must succeed on an Agility test against that character's Spiritual defense or the target isn't drained. The larkin regains the same amount of Investiture as they drained from the target. A character wearing Invested Shardplate can't have their Investiture drained in this way, but the Shardplate itself can be drained of charges."
              - generic [ref=e5421]:
                - generic [ref=e5422]: 
                - heading "Invested Healing." [level=3] [ref=e5423]
                - text: The larkin can spend 1 Investiture to recover 7 (1d6 + 4) health.
