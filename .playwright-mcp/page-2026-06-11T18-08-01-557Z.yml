                - heading "Illusory Disguise." [level=3] [ref=e2428]
                - text: Costs 1 Investiture. The Masked One creates an illusion to disguise themself as another character. While disguised, the Masked One has an advantage on attack tests against enemies unaware of their ruse. This disguise continues until they end it as a free action or use this action to change it.
              - generic [ref=e2429]:
                - generic [ref=e2430]: 
                - heading "Cunning Tongue." [level=3] [ref=e2431]
                - text: The Masked One weaves manipulative words around an enemy they can influence, making a Deception or Persuasion test opposed by the target's Insight. The Masked One gains an advantage on this test if they know one or more of the target's goals, their purpose, or their obstacle. If the Masked One succeeds, the target loses 1d4 focus.
              - generic [ref=e2432]:
                - generic [ref=e2433]: 
                - heading "Surge of Illumination." [level=3] [ref=e2434]
                - text: Costs 1 Investiture. The Masked One chooses a Large (10-foot) or smaller area or willing character within 30 feet of them, creating an illusion on the target which lasts until the end of the scene or until the Masked One chooses to end it as a free action. It's an animated hologram with no sound, and it's revealed to be an illusion if something passes through it. On a character's turn, they can Use a Skill to determine it's an illusion with a successful DC 15 Deduction test. Depending on the nature of the illusion, it can cause an effect such as disguising or duplicating an ally, blocking line of effect, or creating a flash of bright light that applies the Disoriented condition to characters within 10 feet of it. If the effect would apply a condition to a character, they can avoid it with a successful DC 15 Deduction test.
              - generic [ref=e2435]:
                - generic [ref=e2436]: 
                - heading "Regenerate." [level=3] [ref=e2437]
                - text: Costs 1 Investiture. The Masked One recovers 5 (1d6 + 2) health. They can use this free action even while Unconscious or otherwise prevented from using actions.
