            - generic [ref=e350]:
              - heading "Inspiring Leadership." [level=3] [ref=e351]
              - text: When the duelist successfully uses the Gain Advantage action, they can choose one ally they can influence. That ally also gains an advantage on the next test they make against the duelist's target.
            - heading "ACTIONS" [level=2] [ref=e352]
            - separator [ref=e353]
            - generic [ref=e354]:
              - generic [ref=e355]:
                - generic [ref=e356]: 
                - heading "Change Stance." [level=3] [ref=e357]
                - text: "The duelist shifts into one of the following stances, losing the effects of any previous stance and gaining the effects of the new stance. Flamestance: While there's only one enemy within 5 feet of the duelist and no allies within 5 feet of them or that enemy, the duelist can use momentum to gain focus, which they can spend only on the Gain Advantage action or on an action that includes an attack test. Windstance: While there are two or more enemies within 5 feet of the duelist, the duelist can use momentum to gain focus, which they can spend only on the Disengage action or on an action that includes an attack test."
              - generic [ref=e358]:
                - generic [ref=e359]: 
                - heading "Feint." [level=3] [ref=e360]
                - text: The duelist tests Heavy Weaponry against the Cognitive defense of a target within 5 feet of them. If the duelist succeeds, the target loses momentum and 1d4 focus. If the duelist fails, the target loses 1 focus. The duelist can spend momentum from this test to use their Change Stance action as a free action without spending focus.
              - generic [ref=e361]:
                - generic [ref=e362]: 
                - heading "Jarring Insight." [level=3] [ref=e363]
                - text: The duelist reads their enemy with practiced ease, making an opposed Insight test against the target's Discipline. If the duelist succeeds, the target loses one momentum at the beginning of their next turn, or if they're in a conversation, the target gains a disadvantage on their next contribution.
              - generic [ref=e364]:
                - generic [ref=e365]: 
                - heading "Reposition." [level=3] [ref=e366]
                - text: Before the duelist is unwillingly moved, they ignore that effect and use the Disengage action as a free action.
