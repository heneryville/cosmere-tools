                - text: The direform can use their carapace like a shield, allowing them to use the Brace action. While benefiting from Brace, the first time on each turn that the direform either is hit or grazed by a melee attack or is successfully Grappled or Shoved by an enemy, that enemy takes 3 (1d6) keen damage.
