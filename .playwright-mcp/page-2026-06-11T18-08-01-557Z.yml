                - text: "Attack +10*, reach 5 ft., one target. Graze: no effect. Hit: The target takes no damage, but their Physical defense is reduced by 2 until the end of their next turn."
              - generic [ref=e2614]:
                - generic [ref=e2615]: 
                - heading "Change Stance." [level=3] [ref=e2616]
                - text: "The elite shifts into one of the following stances, losing the effects of any previous stance and gaining the effects of the new stance. Bloodstance: The elite's Opportunity range for attack tests and physical tests increases by 2, and their Physical, Cognitive, and Spiritual defenses decrease by 2. Flamestance: While there's only one enemy within 5 feet of the elite and no allies within 5 feet of them or that enemy, the elite can use an advantage to gain focus, which they can spend only on the Gain Advantage action or on an action that includes an attack test. Ironstance: After an enemy within 5 feet of the elite misses or grazes them with an attack, the elite can use the Reactive Strike reaction against that enemy as if they had voluntarily left the elite's reach."
              - generic [ref=e2617]:
                - generic [ref=e2618]: 
                - heading "Distracting Banter." [level=3] [ref=e2619]
                - text: The elite baits their enemy into a smug repartee, making an opposed Intimidation test against the target's Discipline. If the elite succeeds, the target loses 1d4 focus.
