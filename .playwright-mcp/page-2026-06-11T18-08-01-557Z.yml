                - heading "Surge of Gravitation." [level=3] [ref=e1359]
                - text: Costs 1 Investiture. The Heavenly One performs a Basic Lashing on a Huge (15-foot) or smaller character or non-Invested object within their reach that isn't being worn or carried. An object Lashed in this way moves up to 30 feet in any direction. An ally Lashed in this way gains a 30-foot flying rate until the end of the Heavenly One's next turn, but that ally can only fly using the Move action once per turn. To Lash an enemy, the Heavenly One makes a Gravitation test against the enemy's Physical defense. On a success, they move the target up to 30 feet in any direction, and the target becomes Restrained until the start of the Heavenly One's next turn. If the target passes within reach of an object, they can make a DC 16 Agility test, grabbing the object and stopping this forced movement on a success. If a Lashed object collides with a character, or if a Lashed enemy collides with an object or surface during this movement, the character takes 20 (2d10 + 9) damage of a type appropriate to the object or surface, and the Lashed target stops moving. A character can use the Avoid Danger reaction to try to escape damage from an incoming Lashed object.
              - generic [ref=e1360]:
                - generic [ref=e1361]: 
                - heading "Regenerate." [level=3] [ref=e1362]
                - text: Costs 1 Investiture. The Heavenly One recovers 6 (1d6 + 3) health. They can use this free action even while Unconscious or otherwise prevented from using actions.
              - generic [ref=e1363]:
                - generic [ref=e1364]: 
                - heading "Reflexive Strike." [level=3] [ref=e1365]
                - text: Before an enemy voluntarily moves while within 10 feet of the Heavenly One, the Heavenly One uses their Raysium Lance action against that enemy. This reaction counts as a Reactive Strike but costs no focus.
