                - heading "Shardplate (4 Charges)." [level=3] [ref=e2605]
                - text: The elite is equipped with Shardplate. Before they take damage, they can expend a charge (no action required) to increase their deflect value against that damage by 10. While the armor has charges, all Invested tests against the elite gain a disadvantage, and the armor's deflect value applies to all damage types. After the armor runs out of charges, some of the elite's attributes and skills are reduced by 2, along with their related modifiers; these statistics are marked with an asterisk (*).
              - generic [ref=e2606]:
