                - text: "The Husked One escapes their body as a ribbon of red light, leaving behind a husk and any objects they were wearing or carrying. While in ribbon form, the Husked One is under the following effects: They can't use any actions other than Disengage, Move, and their Reform Body. They have a flying rate of 30 feet. They still have mass and can't squeeze through gaps smaller than 1 inch. They're immune to all damage except for spirit damage and damage from Invested weapons. They're immune to the Immobilized, Prone, Restrained, and Slowed conditions."
              - generic [ref=e4488]:
