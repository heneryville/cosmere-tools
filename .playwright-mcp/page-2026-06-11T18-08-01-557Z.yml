                - heading "Pure Tones." [level=3] [ref=e3162]
                - text: The Deepest One ignores the Disoriented condition while standing on or submerged in solid stone.
              - generic [ref=e3163]:
                - heading "Swim Through Stone." [level=3] [ref=e3164]
                - text: The Deepest One can move through solid surfaces as if moving along the ground, ignoring difficult terrain. While fully submerged, the Deepest One must spend 1 focus each time they use an action other than the Move action or their Regenerate free action. The Deepest One can't use this feature on surfaces made of wood.
              - generic [ref=e3165]:
                - heading "Merging Form." [level=3] [ref=e3166]
                - text: Costs 1 Focus. Before the Deepest One takes impact or keen damage from a non-wooden source, they can increase their deflect value to 6 against that damage (no action required).
