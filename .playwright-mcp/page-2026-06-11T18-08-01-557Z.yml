                - text: The Magnified One can take both a fast turn and a slow turn each round. After an enemy finishes a turn, the Magnified One can spend 1 focus to immediately use an extra single or double action. Additionally, they can spend 1 focus on their turn to remove a condition from themself.
              - generic [ref=e4937]:
                - heading "External Carapace." [level=3] [ref=e4938]
                - text: The Magnified One can use their carapace like a shield, allowing them to use the Brace action.
              - generic [ref=e4939]:
                - heading "Shell Binding." [level=3] [ref=e4940]
                - text: When the Magnified One succeeds on the Grapple action against a target, they can spend 1 Investiture to grow a carapace shell over the target, causing the target to also become Immobilized. Even if the target is no longer in the Magnified One's reach, the target remains Immobilized and Restrained until the target or a character who can reach them succeeds on a DC 18 Athletics test to free them from the carapace.
              - generic [ref=e4941]:
                - heading "Immunities." [level=3] [ref=e4942]
                - text: The Magnified One is immune to the Stunned condition.
            - heading "ACTIONS" [level=2] [ref=e4943]
