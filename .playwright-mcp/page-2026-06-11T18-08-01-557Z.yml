                - heading "Chokehold." [level=3] [ref=e4484]
                - text: The Husked One violently grabs a target within 5 feet of them. The target must succeed on a DC 18 Athletics test or become Restrained while the Husked One remains within 5 feet of them. The Husked One can spend 1 focus to also choke the target and make them Afflicted [2d10 vital] until the target is no longer Restrained. As a single action, the target or a character who can reach them can make a DC 18 Athletics test, ending the Restrained condition on a success.
