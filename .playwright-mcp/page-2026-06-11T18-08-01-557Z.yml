                - text: "Attack +14, reach 10 ft., one target. Graze: 11 (2d10) impact damage. Hit: 29 (2d10 + 18) impact damage."
              - generic [ref=e3473]:
                - generic [ref=e3474]: 
                - 'heading "Strike: Whip." [level=3] [ref=e3475]'
                - text: "Attack +14, reach 20 ft., one target. Graze: 6 (1d12) keen damage. Hit: 24 (1d12 + 18) keen damage, and if the target is Huge or Smaller, the Focused One can spend 1 focus to pull the target any number of feet closer to them. Alternatively, if the target is within 10 feet of the Focused One when the attack hits, the Focused One can spend 1 Investiture to make the target Restrained until the end of the target's next turn. While a character is Restrained in this way, the Focused One can't attack with their Whip or Tense Spear."
              - generic [ref=e3476]:
