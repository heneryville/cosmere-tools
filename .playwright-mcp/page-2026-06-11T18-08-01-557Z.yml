                - heading "Invested Enhancement." [level=3] [ref=e3360]
                - text: Costs 1 Investiture. The direform becomes Enhanced [Strength + 1] and Enhanced [Speed +1] until the end of their next turn. This temporarily increases each of their Physical skills by 1, including their Hammer and Longbow actions' attack and damage rolls. At the end of each of the direform's turns, they can spend 1 Investiture to maintain this effect for an additional round.
              - generic [ref=e3361]:
                - generic [ref=e3362]: 
                - heading "Stand Firm." [level=3] [ref=e3363]
                - text: Costs 1 Focus. Before the direform is unwillingly moved or knocked Prone, they ignore that effect.
              - generic [ref=e3364]:
                - generic [ref=e3365]: 
                - heading "Tackle." [level=3] [ref=e3366]
                - text: When an enemy triggers a Reactive Strike from the direform, the direform can instead attempt to Grapple the enemy, spending focus as if they made a Reactive Strike. If the Grapple succeeds, the enemy also takes 3 (1d6) keen damage from the direform's carapace spikes.
