              - generic [ref=e3445]:
                - heading "Boss." [level=3] [ref=e3446]
                - text: The Focused One can take both a fast turn and a slow turn each round. After an enemy finishes a turn, the Focused One can spend 1 focus to immediately use an extra single or double action. Additionally, they can spend 1 focus on their turn to remove a condition from themself.
              - generic [ref=e3447]:
                - heading "Colossal Mass." [level=3] [ref=e3448]
                - text: The Focused One is always considered Gargantuan against unwanted effects, even while their size is reduced by their Tight Form.
            - heading "ACTIONS" [level=2] [ref=e3449]
            - separator [ref=e3450]
            - generic [ref=e3451]:
              - generic [ref=e3452]:
                - generic [ref=e3453]: 
                - heading "Surge of Tension." [level=3] [ref=e3454]
                - text: Costs 1 Investiture. The Focused One chooses a Gargantuan (20-foot) or smaller object made of soft materials within their reach, causing it to become rigid and tough. Depending on the nature of the object being stiffened, this can cause an effect such as giving an ally a +4 bonus to Physical defense, causing an enemy to be Restrained by their own clothing, or creating an improvised weapon that can be wielded as a Tense Spear without spending focus. If the effect would apply a condition to a character, they can avoid it with a successful DC 19 Agility or Athletics test.
              - generic [ref=e3455]:
                - generic [ref=e3456]: 
                - heading "Tight Form." [level=3] [ref=e3457]
                - text: "Costs 2 Investiture. Until the end of the Focused One's next turn, their size decreases to Medium and they gain the following benefits: their deflect value increases to 6 and it can also reduce spirit damage; their movement rate increases to 40 feet; their physical tests have an Opportunity range of 18–20; they can't be grazed by attacks that use weapons (including Shardblades) or that deal impact or keen damage; if they die while in this form, the explosive decompression of their flesh deals 26 (4d12) impact damage to each character within 10 feet of them. At the end of each of their turns, the Focused One can spend 1 Investiture to maintain this effect for an additional round."
              - generic [ref=e3458]:
                - generic [ref=e3459]: 
                - heading "Decompress Grip." [level=3] [ref=e3460]
                - text: While the Focused One is in their Tight Form and has a character Restrained with the Grapple action, they end their Tight Form early to cause that character to take 52 (8d12) impact damage and suffer an injury.
              - generic [ref=e3461]:
                - generic [ref=e3462]: 
                - heading "Launch Boulder." [level=3] [ref=e3463]
                - text: "Costs 1 Focus. Attack +14, range 150/600 ft., one target. On a graze or hit, all other characters within 10 feet of the target must Avoid Danger (DC 19) or take the same damage. Graze: 9 (2d8) impact damage. Hit: 31 (2d8 + 22) impact damage."
              - generic [ref=e3464]:
                - generic [ref=e3465]: 
                - heading "Regenerate." [level=3] [ref=e3466]
                - text: Costs 1 Investiture. The Focused One recovers 7 (1d6 + 4) health. They can use this free action even while Unconscious or otherwise prevented from using actions.
