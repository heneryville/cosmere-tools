            - generic [ref=e4945]:
              - generic [ref=e4946]:
                - generic [ref=e4947]: 
                - heading "Grow Carapace." [level=3] [ref=e4948]
                - text: "Costs 1 Investiture. The Magnified One grows their carapace for additional armor or spikes, gaining the corresponding benefit. Carapace Armor: The Magnified One can't be grazed until the end of their next turn. Carapace Spikes: Until the end of the Magnified One's next turn, the first time each turn that a character either hits the Magnified One with a melee attack or successfully Grapples or Shoves the Magnified One, that character takes 11 (2d10) keen damage."
              - generic [ref=e4949]:
                - generic [ref=e4950]: 
                - heading "Magnified Charge." [level=3] [ref=e4951]
                - text: Costs 2 Focus. The Magnified One moves up to 25 feet in a straight line without triggering Reactive Strikes. The first time the Magnified One comes within 5 feet of each enemy during this move, the Magnified One can make a Carapace Weapon attack against that enemy as a free action. On a hit, the enemy is also knocked Prone.
              - generic [ref=e4952]:
                - generic [ref=e4953]: 
                - heading "Surge of Progression." [level=3] [ref=e4954]
                - text: Costs 2 Investiture. The Magnified One chooses a Huge (15-foot) or smaller area within 30 feet of them, growing their carapace with incredible speed in a way they choose, though not violently enough to cause damage. Depending on the nature of the carapace construction, this can cause an effect such as the creation of cover, difficult terrain, or a structure, or it can cause characters in that area to become Immobilized. If the effect would apply a condition to a character, they can avoid it with a successful DC 16 Agility or Athletics test.
              - generic [ref=e4955]:
                - generic [ref=e4956]: 
                - heading "Regenerate." [level=3] [ref=e4957]
                - text: Costs 1 Investiture. The Magnified One recovers 15 (1d10 + 10) health and recovers from up to one injury of their choice. They can use this free action even while Unconscious or otherwise prevented from using actions.
