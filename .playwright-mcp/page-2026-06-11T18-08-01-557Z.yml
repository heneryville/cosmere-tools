                - text: "Attack +12, reach 5 ft., one target. Graze: 9 (2d8) spirit damage. Hit: 25 (2d8 + 16) spirit damage, and the servant of Yelig-nar can spend 1 focus to knock the target Prone."
              - generic [ref=e2179]:
