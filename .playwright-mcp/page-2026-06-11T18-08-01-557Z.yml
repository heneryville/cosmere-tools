              - generic [ref=e440]:
                - heading "Quick Hands." [level=3] [ref=e441]
                - text: When a character triggers a Reactive Strike reaction from the thief, the thief can instead use their Pickpocket as a reaction (without spending focus for a Reactive Strike).
              - generic [ref=e442]:
                - heading "Vanishing Act." [level=3] [ref=e443]
                - text: At the end of the thief's turn, if they're in cover or in an area where their enemy's primary sense is obscured, the thief can make a Stealth test (no action required) with advantage against the Spiritual defense of each enemy who can sense them. Each enemy they succeed against loses track of them and can no longer sense them until the thief attacks or takes another action that would expose them.
            - heading "ACTIONS" [level=2] [ref=e444]
            - separator [ref=e445]
            - generic [ref=e446]:
              - generic [ref=e447]:
                - generic [ref=e448]: 
                - heading "Disorienting Distraction." [level=3] [ref=e449]
                - text: The thief throws sand, flour, or a similar substance to distract and confuse foes. Each enemy within 10 feet of them must succeed on a DC 13 Agility test or become Disoriented until the end of the thief's next turn.
              - generic [ref=e450]:
                - generic [ref=e451]: 
                - heading "Pickpocket." [level=3] [ref=e452]
                - text: The thief attempts to rifle through the belongings of a humanoid within 5 feet of them, making an opposed Thievery test against the target's Perception. If the target is Disoriented, the target gains a disadvantage on their test. If the thief succeeds, they can choose to steal up to 50 marks or one item the target isn't wielding or wearing.
              - generic [ref=e453]:
                - generic [ref=e454]: 
                - heading "Slippery." [level=3] [ref=e455]
                - text: After an enemy ends a Move action within 5 feet of the thief, the thief can use the Disengage action as a reaction. If the thief ends this movement in cover or in an area where an enemy's primary sense is obscured, enemies affected by that cover or obscured senses gain a disadvantage on attacks against the thief until the end of the thief's next turn.
