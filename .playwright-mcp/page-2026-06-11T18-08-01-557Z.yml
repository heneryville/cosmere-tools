              - generic [ref=e3170]:
                - generic [ref=e3171]: 
                - heading "Grasping Hands." [level=3] [ref=e3172]
                - text: The Deepest One strangles a target they can sense within 5 feet of them. The target must succeed on a DC 17 Agility test or become Restrained while the Deepest One remains within 5 feet of them. If the Restrained target is also Prone, they begin suffocating and are Afflicted [2d10 vital] until they remove either the Restrained or Prone condition. As a single action, the Restrained target can make a DC 17 Agility test, removing the Restrained condition on a success. If the Deepest One takes at least 20 damage on a single turn, the target escapes and is no longer Restrained.
              - generic [ref=e3173]:
                - generic [ref=e3174]: 
                - heading "Surge of Cohesion." [level=3] [ref=e3175]
                - text: Costs 1 Investiture. The Deepest One chooses a Large (10-foot) or smaller area or object within 30 feet of them that is made of stone or earth and that isn't being worn or held. That object or area changes shape in a manner they choose, though not violently enough to cause damage. Depending on the nature of the reshaping, this can cause an effect such as creating or removing cover or difficult terrain, or applying the Restrained condition to characters in that area. If the effect would apply a condition, a character can avoid it with a successful DC 15 Agility or Athletics test.
              - generic [ref=e3176]:
                - generic [ref=e3177]: 
                - heading "Regenerate." [level=3] [ref=e3178]
                - text: Costs 1 Investiture. The Deepest One recovers 5 (1d6 + 2) health. They can use this free action even while Unconscious or otherwise prevented from using actions.
              - generic [ref=e3179]:
                - generic [ref=e3180]: 
                - heading "Entrap." [level=3] [ref=e3181]
                - text: When an enemy triggers a Reactive Strike from the Deepest One while the Deepest One is submerged, the Deepest One can instead use their Grasping Hands as a reaction, spending focus as if they made a Reactive Strike.
